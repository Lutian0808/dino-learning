<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiger快乐星球">
<meta name="theme-color" content="#FF6F00">
<meta name="description" content="Tiger快乐星球，适合4-6岁幼儿的每日学习工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🐯 Tiger快乐星球</title>
<style>
:root {
  --primary: #FF6F00; --primary-dark: #E65100; --primary-light: #FFF3E0;
  --accent: #FFC107; --accent-light: #FFF8E1;
  --green: #FF9800; --green-light: #FFF3E0;
  --blue: #42A5F5; --blue-light: #E3F2FD;
  --purple: #AB47BC; --purple-light: #F3E5F5;
  --pink: #EC407A; --pink-light: #FCE4EC;
  --orange: #FF7043; --orange-light: #FBE9E7;
  --teal: #26A69A; --teal-light: #E0F2F1;
  --bg: #FFF8E1; --card-bg: #FFFFFF;
  --text: #3E2723; --text-light: #8D6E63;
  --border: #FFE0B2;
  --shadow: 0 4px 12px rgba(255, 111, 0, 0.12);
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ===== 顶部 ===== */
.topbar {
  background: linear-gradient(135deg,#FF6F00 0%,#FF9800 50%,#FFB74D 100%);
  color: white; padding: 10px 20px; display: flex; align-items: center;
  justify-content: space-between; box-shadow: 0 2px 10px rgba(255,111,0,0.25);
  position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.dino-logo { font-size: 30px; animation: bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
.topbar h1 { font-size: 18px; font-weight: 800; }
.topbar-sub { font-size: 11px; opacity: 0.9; }
.topbar-right { display: flex; gap: 8px; flex-wrap: wrap; }
.top-badge { background: rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 16px; font-size: 12px; font-weight: 600; }

/* ===== 布局：左任务栏 + 右内容 ===== */
.layout { display: flex; height: calc(100vh - 56px); }

/* ===== 左侧任务栏 ===== */
.sidebar {
  width: 240px; background: white; border-right: 2px solid var(--border);
  overflow-y: auto; flex-shrink: 0; padding: 12px 0;
}
.sidebar-section { padding: 0 14px 8px; }
.sidebar-section h3 {
  font-size: 11px; color: var(--text-light); letter-spacing: 1px;
  margin: 8px 0 6px; padding-top: 6px; border-top: 1px solid var(--border);
}
.sidebar-section:first-child h3 { border-top: none; padding-top: 0; }

/* 天数选择器 */
.day-selector {
  display: flex; align-items: center; gap: 4px; margin: 4px 0 8px;
}
.day-selector button {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
  background: white; font-size: 16px; cursor: pointer; font-weight: 700;
  color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
}
.day-selector button:hover { background: var(--primary-light); }
.day-selector .day-num {
  font-size: 18px; font-weight: 800; color: var(--primary-dark); min-width: 60px; text-align: center;
}
.day-selector .day-badge {
  font-size: 10px; background: var(--green-light); color: var(--green);
  padding: 2px 8px; border-radius: 10px; font-weight: 600;
}

/* 模块导航 */
.module-nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; margin: 2px 0; border-radius: 10px;
  cursor: pointer; font-size: 14px; font-weight: 600;
  transition: all 0.2s; border-left: 3px solid transparent;
}
.module-nav-item:hover { background: var(--primary-light); }
.module-nav-item.active {
  background: var(--primary-light); border-left-color: var(--primary);
  color: var(--primary-dark); font-weight: 700;
}
.module-nav-item.completed { opacity: 0.7; }
.module-nav-item .nav-icon { font-size: 20px; width: 28px; text-align: center; }
.module-nav-item .nav-check {
  margin-left: auto; font-size: 14px; color: var(--green); display: none;
}
.module-nav-item.completed .nav-check { display: block; }

/* 底部统计 */
.sidebar-stats {
  padding: 10px 14px; margin-top: 8px; border-top: 1px solid var(--border);
}
.sidebar-stats .stat-row {
  display: flex; justify-content: space-between; font-size: 12px;
  padding: 3px 0; color: var(--text-light);
}
.sidebar-stats .stat-row strong { color: var(--primary-dark); }

/* ===== 右侧内容区 ===== */
.content {
  flex: 1; overflow-y: auto; padding: 20px 24px;
}

/* 进度条 */
.progress-bar-wrap {
  background: var(--primary-light); border-radius: 12px; height: 10px;
  margin-bottom: 16px; overflow: hidden;
}
.progress-bar-fill {
  background: linear-gradient(90deg, var(--primary), var(--green));
  height: 100%; border-radius: 12px; transition: width 0.5s;
}
.progress-text {
  font-size: 12px; color: var(--text-light); margin-bottom: 6px;
  display: flex; justify-content: space-between;
}

/* 模块内容卡片 */
.module-panel {
  background: var(--card-bg); border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow); border: 2px solid var(--border);
  min-height: 300px; position: relative;
}
.module-panel.poem { border-top: 5px solid var(--purple); }
.module-panel.characters { border-top: 5px solid var(--blue); }
.module-panel.math { border-top: 5px solid var(--green); }
.module-panel.english { border-top: 5px solid var(--pink); }
.module-panel.thinking { border-top: 5px solid var(--accent); }
.module-panel.science { border-top: 5px solid var(--orange); }
.module-panel.exercise { border-top: 5px solid var(--teal); }

.panel-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 2px dashed var(--border);
}
.panel-icon { font-size: 32px; }
.panel-title { font-size: 22px; font-weight: 800; flex: 1; }
.panel-time { font-size: 13px; color: var(--text-light); background: var(--bg); padding: 3px 10px; border-radius: 10px; }
.panel-body { font-size: 16px; line-height: 2; }

/* 各模块内容样式 */
.poem-title { font-size: 20px; font-weight: 700; color: var(--purple); margin-bottom: 4px; }
.poem-author { font-size: 14px; color: var(--text-light); margin-bottom: 14px; }
.poem-lines { font-size: 22px; line-height: 2.2; text-align: center; padding: 20px; background: var(--purple-light); border-radius: 14px; font-weight: 700; letter-spacing: 3px; }

.char-grid { display: flex; gap: 16px; margin: 16px 0; justify-content: center; flex-wrap: wrap; }
.char-box { background: var(--blue-light); border-radius: 14px; padding: 16px 24px; text-align: center; min-width: 90px; }
.char-box .char { font-size: 48px; font-weight: 900; color: var(--blue); display: block; }
.char-box .pinyin { font-size: 14px; color: var(--text-light); }
.char-desc { font-size: 15px; color: var(--text); background: var(--bg); padding: 8px 14px; border-radius: 8px; margin: 8px 0; }

.math-q { background: var(--green-light); padding: 14px 18px; border-radius: 12px; margin: 10px 0; font-size: 18px; font-weight: 700; }
.math-answer { font-size: 14px; color: var(--text-light); margin-top: 4px; display: none; }
.math-answer.show { display: block; }
.show-answer-btn { background: var(--green); color: white; border: none; padding: 6px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-top: 8px; font-weight: 600; }

.eng-word { display: flex; align-items: center; gap: 14px; background: var(--pink-light); padding: 14px 20px; border-radius: 12px; margin: 10px 0; }
.eng-word .emoji { font-size: 36px; }
.eng-word .word { font-size: 26px; font-weight: 800; color: var(--pink); }
.eng-word .meaning { font-size: 18px; color: var(--text); }
.eng-phrase { background: var(--accent-light); padding: 14px 20px; border-radius: 12px; margin-top: 12px; font-weight: 700; text-align: center; font-size: 18px; }

.thinking-content { background: var(--accent-light); padding: 16px 20px; border-radius: 12px; font-size: 16px; margin: 10px 0; }
.thinking-answer { font-size: 14px; color: var(--text-light); margin-top: 6px; display: none; }
.thinking-answer.show { display: block; }

.sci-content { background: var(--orange-light); padding: 16px 20px; border-radius: 12px; font-size: 16px; margin: 10px 0; line-height: 1.9; }

.exercise-item { display: flex; align-items: center; gap: 10px; background: var(--teal-light); padding: 12px 18px; border-radius: 12px; margin: 8px 0; font-size: 17px; font-weight: 700; }

.guide-box { background: linear-gradient(135deg,#FFF8E1 0%,#E8F5E9 100%); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 8px; margin: 14px 0; font-size: 14px; }
.guide-box .guide-label { font-weight: 700; color: var(--primary-dark); }
.task-box { background: var(--green-light); border-left: 4px solid var(--green); padding: 10px 16px; border-radius: 8px; margin-top: 10px; font-size: 15px; font-weight: 700; }
.task-box .task-label { color: var(--green); }

/* 打卡按钮 */
.checkin-btn {
  display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
  font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white; transition: all 0.3s; text-align: center;
}
.checkin-btn:hover { transform: scale(1.01); box-shadow: 0 4px 12px rgba(76,175,80,0.4); }
.checkin-btn.done { background: var(--green); }

/* 底部积分奖励区 */
.rewards-area {
  background: white; border-radius: var(--radius); padding: 18px; margin-top: 16px;
  box-shadow: var(--shadow); border: 2px solid var(--border);
}
.rewards-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.rewards-header h3 { font-size: 16px; font-weight: 800; color: var(--primary-dark); }
.points-big { font-size: 22px; font-weight: 900; color: var(--accent); }
.add-reward-btn { background: var(--accent); color: var(--text); border: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.reward-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.reward-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--bg); border: 2px solid var(--border); }
.reward-item.claimed { background: var(--green-light); opacity: 0.7; }
.reward-info { flex: 1; }
.reward-name { font-weight: 700; font-size: 14px; }
.reward-cost { font-size: 12px; color: var(--text-light); }
.reward-actions { display: flex; gap: 6px; }
.reward-actions button { border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-claim { background: var(--accent); color: var(--text); }
.btn-claim:disabled { background: #ccc; }
.btn-edit { background: var(--blue); color: white; }
.btn-del { background: #EF5350; color: white; }

/* 成就徽章 */
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--bg); border: 2px solid var(--border); color: var(--text-light); }
.badge.unlocked { background: var(--accent-light); border-color: var(--accent); color: var(--primary-dark); }

/* 奖励弹窗 */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-box { background: white; border-radius: var(--radius); padding: 20px; max-width: 400px; width: 90%; }
.modal-box h3 { font-size: 18px; margin-bottom: 12px; }
.modal-box label { display: block; font-size: 13px; font-weight: 600; margin: 8px 0 4px; color: var(--text-light); }
.modal-box input, .modal-box textarea { width: 100%; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
.modal-box textarea { height: 60px; resize: vertical; }
.modal-btns { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
.modal-btns button { border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-save { background: var(--primary); color: white; }
.btn-cancel { background: #ccc; color: var(--text); }

/* 响应式 */
@media (max-width: 768px) {
  .layout { flex-direction: row; height: calc(100vh - 56px); }
  .sidebar { width: 130px; height: 100%; border-right: 2px solid var(--border); border-bottom: none; padding: 8px 6px; overflow-y: auto; }
  .sidebar-section { padding: 0 4px 6px; }
  .sidebar-section:first-child { display: block; }
  .sidebar-section h3 { font-size: 10px; margin: 6px 0 4px; padding-top: 4px; }
  .day-selector { gap: 2px; margin: 2px 0 4px; }
  .day-selector button { width: 22px; height: 22px; font-size: 12px; }
  .day-selector .day-num { font-size: 14px; min-width: 44px; }
  .day-badge { font-size: 9px; padding: 1px 4px; }
  .module-nav-item { padding: 6px 4px; font-size: 11px; margin: 1px 0; gap: 4px; border-left: 2px solid transparent; }
  .module-nav-item .nav-icon { font-size: 14px; width: 18px; }
  .module-nav-item.active { border-left-color: var(--primary); }
  .content { padding: 10px; overflow-y: auto; }
  .panel-body { font-size: 14px; }
  .poem-lines { font-size: 18px; }
  .char-box .char { font-size: 36px; }
  .eng-word .word { font-size: 20px; }
}
</style>
</head>
<body>

<!-- 顶部 -->
<div class="topbar">
  <div class="topbar-left">
    <span class="dino-logo">🐯</span>
    <div>
      <h1>Tiger快乐星球</h1>
      <div class="topbar-sub">4-6岁 · 每日60分钟 · 7大模块</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="top-badge">🔥 连续 <span id="streakNum">0</span> 天</div>
    <div class="top-badge">🪙 <span id="topPoints">0</span> 分</div>
    <div class="top-badge">⭐ <span id="totalStars">0</span> 星</div>
  </div>
</div>

<div class="layout">
  <!-- 左侧任务栏 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>📅 今日任务</h3>
      <div class="day-selector">
        <button onclick="prevDay()">◀</button>
        <span class="day-num" id="dayLabel">第1天</span>
        <button onclick="nextDay()">▶</button>
      </div>
      <span class="day-badge" id="dayBadge">0/7 完成</span>
    </div>
    <div class="sidebar-section">
      <h3>📚 七大模块</h3>
      <div id="moduleNav"></div>
    </div>
    <div class="sidebar-stats">
      <div class="stat-row"><span>🪙 总积分</span><strong id="sPoints">0</strong></div>
      <div class="stat-row"><span>⭐ 总星星</span><strong id="sStars">0</strong></div>
      <div class="stat-row"><span>🏆 完成天数</span><strong id="sDays">0</strong></div>
    </div>
    <div style="padding:10px 14px;">
      <div class="badges" id="badges">
        <div class="badge" id="badge1">🥚 1天</div>
        <div class="badge" id="badge3">🦎 3天</div>
        <div class="badge" id="badge5">🐯 5天</div>
        <div class="badge" id="badge7">🦖 7天</div>
        <div class="badge" id="badge15">👑 15天</div>
        <div class="badge" id="badge30">🏆 30天</div>
      </div>
    </div>
  </aside>

  <!-- 右侧内容区 -->
  <main class="content">
    <!-- 进度条 -->
    <div class="progress-text"><span>今日完成进度</span><span id="progressLabel">0/7</span></div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>

    <!-- 模块内容面板 -->
    <div class="module-panel" id="modulePanel"></div>

    <!-- 积分奖励区 -->
    <div class="rewards-area">
      <div class="rewards-header">
        <h3>🪙 积分奖励中心 <span class="points-big" id="pointsTotal">0</span> 分</h3>
        <button class="add-reward-btn" onclick="openRewardModal()">➕ 添加奖励</button>
      </div>
      <p style="font-size:12px;color:var(--text-light);margin:4px 0;">每完成一个模块 +10 积分</p>
      <div class="reward-list" id="rewardList"></div>
    </div>
  </main>
</div>

<!-- 奖励弹窗 -->
<div class="modal-overlay" id="rewardModal">
  <div class="modal-box">
    <h3 id="modalTitle">添加奖励</h3>
    <label>奖励名称</label>
    <input type="text" id="rewardName" placeholder="例如：看一集动画片">
    <label>所需积分</label>
    <input type="number" id="rewardCost" placeholder="例如：50" min="1">
    <label>描述（可选）</label>
    <textarea id="rewardDesc" placeholder="例如：可以看20分钟动画片"></textarea>
    <input type="hidden" id="rewardEditId" value="">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRewardModal()">取消</button>
      <button class="btn-save" onclick="saveReward()">保存</button>
    </div>
  </div>
</div>

<script>
const DATA = {
  "meta": {
    "title": "Tiger快乐星球 每日学习",
    "targetAge": "4-6岁（幼儿园中班、大班）",
    "dailyMinutes": 60,
    "moduleMinutes": 8,
    "modules": [
      "古诗",
      "识字",
      "算数",
      "英语",
      "思维训练",
      "科普",
      "运动游戏"
    ]
  },
  "days": {
    "day1": {
      "date": "第1天",
      "poem": {
        "title": "咏鹅",
        "author": "唐·骆宾王",
        "lines": [
          "鹅，鹅，鹅，",
          "曲项向天歌。",
          "白毛浮绿水，",
          "红掌拨清波。"
        ],
        "guide": "宝宝，你看小鹅在水里游，脖子弯弯的，多可爱呀！我们一起念一念。",
        "task": "跟读2遍，背给爸爸妈妈听"
      },
      "characters": {
        "items": [
          {
            "char": "天",
            "pinyin": "tiān",
            "desc": "天上有什么？太阳、月亮、星星都在天上哦！"
          },
          {
            "char": "白",
            "pinyin": "bái",
            "desc": "白白的云朵，白白的雪，白色真干净！"
          },
          {
            "char": "水",
            "pinyin": "shuǐ",
            "desc": "水可以喝，可以洗手，小鱼在水里游。"
          }
        ],
        "task": "每个字读3遍，找一找生活中有没有这些字"
      },
      "math": {
        "title": "认识数字1-5",
        "questions": [
          "数一数：🍎🍎🍎 有几个苹果？",
          "数一数：⭐⭐⭐⭐⭐ 有几颗星星？",
          "比一比：2和3，哪个大？"
        ],
        "answers": [
          "3个",
          "5个",
          "3大"
        ],
        "guide": "宝宝用手指指着数，一个一个数，不要着急哦！",
        "task": "完成3道题，全对贴一颗星⭐"
      },
      "english": {
        "words": [
          {
            "word": "apple",
            "meaning": "苹果",
            "emoji": "🍎"
          },
          {
            "word": "banana",
            "meaning": "香蕉",
            "emoji": "🍌"
          }
        ],
        "phrase": "Good morning!（早上好！）",
        "guide": "宝宝跟读：apple苹果🍎，banana香蕉🍌，早上好Good morning！",
        "task": "每个单词读3遍，对妈妈说Good morning!"
      },
      "thinking": {
        "title": "找不同",
        "content": "看看这两排小动物：🐶🐱🐶🐱🐶 和 🐶🐱🐶🐶🐱，哪里不一样呢？",
        "answer": "第4个不同，第一排是猫咪，第二排是小狗",
        "guide": "引导宝宝一个一个对比，找出不一样的地方。",
        "task": "找出不同，再说一说为什么"
      },
      "science": {
        "title": "为什么会下雨？",
        "content": "天上的云朵里有很多小水滴。小水滴越来越多、越来越重，就从天上掉下来啦，这就是下雨！就像宝宝洗澡时水从花洒流下来一样。",
        "guide": "下雨的时候带宝宝看看窗外，问：雨是从哪里来的呀？",
        "task": "说说看，下雨天你要带什么？"
      },
      "exercise": {

function getDefaultRewards() {
  return [
    {id:'r1',name:'看一集动画片',cost:50,desc:'20分钟动画片',claimed:false},
    {id:'r2',name:'吃一根冰淇淋',cost:80,desc:'选喜欢的口味',claimed:false},
    {id:'r3',name:'去游乐场玩',cost:200,desc:'周末去一次',claimed:false},
    {id:'r4',name:'买个新玩具',cost:300,desc:'选一个喜欢的',claimed:false},
    {id:'r5',name:'吃一顿大餐',cost:500,desc:'选喜欢的餐厅',claimed:false},
  ];
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE));
    if (s) {
      if (!s.rewards) s.rewards = getDefaultRewards();
      if (s.points === undefined) s.points = 0;
      if (!s.claimedRewards) s.claimedRewards = {};
      return s;
    }
  } catch(e) {}
  return {completed:{},streak:0,totalStars:0,points:0,rewards:getDefaultRewards(),claimedRewards:{}};
}
function saveState() { localStorage.setItem(STORAGE, JSON.stringify(state)); }

function getDone(day) { return state.completed[day] || {}; }
function countDone(day) { return Object.values(getDone(day)).filter(v=>v).length; }
function isDayFull(day) { return countDone(day) === 7; }

// 左侧模块导航
function renderModuleNav() {
  const nav = document.getElementById('moduleNav');
  nav.innerHTML = '';
  const done = getDone(curDay);
  MODULES.forEach(m => {
    const d = document.createElement('div');
    d.className = 'module-nav-item' + (m.key === curModule ? ' active' : '') + (done[m.key] ? ' completed' : '');
    d.innerHTML = `<span class="nav-icon">${m.icon}</span><span>${m.name}</span><span class="nav-check">✅</span>`;
    d.onclick = () => { curModule = m.key; renderAll(); };
    nav.appendChild(d);
  });
}

// 右侧模块内容

function toggleMathAnswers() {
  const day = DATA.days[curDay];
  day.math.questions.forEach((_,i) => {
    const el = document.getElementById('ans_'+i);
    if (el) el.classList.toggle('show');
  });
}

// 打卡
function toggleCheckin() {
  if (!state.completed[curDay]) state.completed[curDay] = {};
  const wasDone = state.completed[curDay][curModule];
  if (wasDone) {
    state.completed[curDay][curModule] = false;
    state.totalStars = Math.max(0, state.totalStars - 1);
    state.points = Math.max(0, state.points - 10);
  } else {
    state.completed[curDay][curModule] = true;
    state.totalStars++;
    state.points += 10;
    showAnim('🐯');
    showAnim('+10🪙');
  }
  updateStreak();
  saveState();
  renderAll();
}

function showAnim(text) {
  const el = document.createElement('div');
  el.textContent = text;
  el.style.cssText = 'position:fixed;top:40%;left:50%;font-size:48px;z-index:9999;pointer-events:none;animation:floatUp 1s ease-out forwards;';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
const animStyle = document.createElement('style');
animStyle.textContent = '@keyframes floatUp{0%{transform:translate(-50%,0) scale(0);opacity:1}50%{transform:translate(-50%,-40px) scale(1.5);opacity:1}100%{transform:translate(-50%,-100px) scale(0.5);opacity:0}}';
document.head.appendChild(animStyle);

function updateStreak() {
  const days = Object.keys(DATA.days);
  let s = 0;
  for (const d of days) { if (isDayFull(d)) s++; }
  state.streak = s;
}

// 天数切换
function prevDay() {
  const days = Object.keys(DATA.days);
  const idx = days.indexOf(curDay);
  if (idx > 0) { curDay = days[idx-1]; curModule = 'poem'; renderAll(); }
}
function nextDay() {
  const days = Object.keys(DATA.days);
  const idx = days.indexOf(curDay);
  if (idx < days.length-1) { curDay = days[idx+1]; curModule = 'poem'; renderAll(); }
}

// 奖励
function renderRewards() {
  document.getElementById('pointsTotal').textContent = state.points;
  document.getElementById('topPoints').textContent = state.points;
  const list = document.getElementById('rewardList');
  list.innerHTML = '';
  state.rewards.forEach(r => {
    const claimed = state.claimedRewards[r.id] || false;
    const can = state.points >= r.cost && !claimed;
    const d = document.createElement('div');
    d.className = 'reward-item' + (claimed?' claimed':'');
    d.innerHTML = `<span style="font-size:24px;">🎁</span><div class="reward-info"><div class="reward-name">${r.name}</div><div class="reward-cost">${r.cost} 积分 | ${claimed?'已兑换':'还差'+(r.cost-state.points)+'分'}</div>${r.desc?`<div style="font-size:11px;color:var(--text-light)">${r.desc}</div>`:''}</div><div class="reward-actions"><button class="btn-claim" ${!can?'disabled':''} onclick="claimReward('${r.id}')">${claimed?'已兑':'兑换'}</button><button class="btn-edit" onclick="editReward('${r.id}')">✏️</button><button class="btn-del" onclick="deleteReward('${r.id}')">🗑️</button></div>`;
    list.appendChild(d);
  });
}

function claimReward(id) {
  const r = state.rewards.find(r=>r.id===id);
  if (!r || state.points < r.cost || state.claimedRewards[id]) return;
  state.points -= r.cost;
  state.claimedRewards[id] = true;
  saveState(); renderAll();
  alert('🎉 兑换成功！'+r.name+'\n快去享受你的奖励吧！');
}

function openRewardModal(eid) {
  document.getElementById('rewardModal').classList.add('active');
  if (eid) {
    const r = state.rewards.find(r=>r.id===eid);
    if (r) {
      document.getElementById('modalTitle').textContent='编辑奖励';
      document.getElementById('rewardName').value=r.name;
      document.getElementById('rewardCost').value=r.cost;
      document.getElementById('rewardDesc').value=r.desc||'';
      document.getElementById('rewardEditId').value=eid;
      return;
    }
  }
  document.getElementById('modalTitle').textContent='添加奖励';
  document.getElementById('rewardName').value='';
  document.getElementById('rewardCost').value='';
  document.getElementById('rewardDesc').value='';
  document.getElementById('rewardEditId').value='';
}
function closeRewardModal() { document.getElementById('rewardModal').classList.remove('active'); }
function saveReward() {
  const name = document.getElementById('rewardName').value.trim();
  const cost = parseInt(document.getElementById('rewardCost').value);
  const desc = document.getElementById('rewardDesc').value.trim();
  const eid = document.getElementById('rewardEditId').value;
  if (!name) return alert('请输入奖励名称');
  if (!cost || cost<1) return alert('请输入积分数');
  if (eid) {
    const idx = state.rewards.findIndex(r=>r.id===eid);
    if (idx>=0) { state.rewards[idx].name=name; state.rewards[idx].cost=cost; state.rewards[idx].desc=desc; }
  } else {
    state.rewards.push({id:'r'+Date.now(),name,cost,desc,claimed:false});
  }
  saveState(); closeRewardModal(); renderAll();
}
function editReward(id) { openRewardModal(id); }
function deleteReward(id) {
  if (!confirm('确定删除？')) return;
  state.rewards = state.rewards.filter(r=>r.id!==id);
  delete state.claimedRewards[id];
  saveState(); renderAll();
}

// 通用更新
function renderAll() {
  const day = DATA.days[curDay];
  const cnt = countDone(curDay);
  document.getElementById('dayLabel').textContent = day.date;
  document.getElementById('dayBadge').textContent = cnt+'/7 完成';
  document.getElementById('progressLabel').textContent = cnt+'/7';
  document.getElementById('progressBar').style.width = (cnt/7*100)+'%';
  document.getElementById('sPoints').textContent = state.points;
  document.getElementById('sStars').textContent = state.totalStars;
  document.getElementById('totalStars').textContent = state.totalStars;
  document.getElementById('streakNum').textContent = state.streak;
  const cd = Object.keys(DATA.days).filter(d=>isDayFull(d)).length;
  document.getElementById('sDays').textContent = cd;
  document.getElementById('badge1').classList.toggle('unlocked',cd>=1);
  document.getElementById('badge3').classList.toggle('unlocked',state.streak>=3);
  document.getElementById('badge5').classList.toggle('unlocked',state.streak>=5);
  document.getElementById('badge7').classList.toggle('unlocked',state.streak>=7);
  document.getElementById('badge15').classList.toggle('unlocked',cd>=15);
  document.getElementById('badge30').classList.toggle('unlocked',cd>=30);
  renderModuleNav();
  renderPanel();
  renderRewards();
}

renderAll();
</script>
</body>
</html>
